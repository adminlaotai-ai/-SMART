# Deploy ໜ້າເວັບຂຶ້ນ GitHub Pages (ຟຣີ) ທຸກຄັ້ງທີ່ push ຂຶ້ນ main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      # Pages ຢູ່ໃນໂຟລເດີ /-SMART/ — ປ່ຽນ path ສະຄຣິບເປັນແບບ relative ສະເພາະສຳລັບ Pages
      - run: sed -i -E 's#(src|href)="/([^/"])#\1="\2#g' public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
